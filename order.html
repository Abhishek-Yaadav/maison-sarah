<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header>
      <div class="container">
        <div class="header-box">
          <h1 class="brand">Order</h1>

          <nav>
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="order.html">Order</a>
          </nav>
        </div>
      </div>
    </header>

    <main>
      <div class="container">
        <form>
          <fieldset>
            <legend>Who is picking up?</legend>

            <label for="name">Name</label>
            <input
              type="text"
              id="name"
              name="name"
              class="field"
              placeholder="Your name"
              required
            />

            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              class="field"
              placeholder="you@example.com"
              required
            />
          </fieldset>
          <fieldset>
            <legend>Pickup Day</legend>

            <label>
              <input type="radio" name="day" value="Saturday" checked />
              Saturday
            </label>

            <label>
              <input type="radio" name="day" value="Sunday" />
              Sunday
            </label>

            <label for="time">Pickup Time</label>
            <select id="time" name="time" class="field">
              <option>09:00</option>
              <option>10:00</option>
              <option>11:00</option>
              <option>12:00</option>
              <option>13:00</option>
              <option>14:00</option>
              <option>15:00</option>
            </select>
          </fieldset>
          <fieldset>
            <legend>Your Order</legend>

            <label>
              <input type="checkbox" name="order" value="Butter Croissant" />
              Butter Croissant
            </label>

            <label>
              <input type="checkbox" name="order" value="Cinnamon Roll" />
              Cinnamon Roll
            </label>

            <label>
              <input type="checkbox" name="order" value="Blueberry Muffin" />
              Blueberry Muffin
            </label>

            <label for="notes">Notes</label>
            <textarea
              id="notes"
              name="notes"
              class="field"
              rows="4"
              placeholder="Any special requests?"
            ></textarea>

            <button type="submit">Submit Order</button>
          </fieldset>
        </form>
      </div>
    </main>

    <footer>
      <div class="container">
        <p>Berlin, Germany</p>
      </div>
    </footer>
  </body>
</html>
